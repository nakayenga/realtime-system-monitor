name: CI-CD


on:

  push:

    branches:

      - main


permissions:

  contents: read

  id-token: write


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          pip install -r producer/requirements.txt

          pip install -r consumer/requirements.txt

          pip install pytest


      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -v


  build:

    needs: test

    runs-on: ubuntu-latest


    steps:

      - uses: actions/checkout@v4


      - name: Azure login

        uses: azure/login@v2

        with:

          client-id:
            ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id:
            ${{ secrets.AZURE_TENANT_ID }}

          subscription-id:
            ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Login to ACR

        run: |

          az acr login \
          --name "${{ secrets.ACR_NAME }}"


      - name: Build consumer

        run: |

          docker build \
          -f consumer/Dockerfile \
          -t "${{ secrets.ACR_LOGIN_SERVER }}/metrics-consumer:${{ github.sha }}" \
          .


      - name: Push consumer

        run: |

          docker push \
          "${{ secrets.ACR_LOGIN_SERVER }}/metrics-consumer:${{ github.sha }}"